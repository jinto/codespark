name: CodeSpark
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 5.10
targets:
  CodeSpark:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - CodeSpark
    preBuildScripts:
      - name: Build workspace-core (Zig)
        basedOnDependencyAnalysis: false
        script: |
          # Without this the phase reports the status of its LAST command — `rm -rf` —
          # so a Zig compile error left the build green and linked whatever stale
          # libworkspace-core.a happened to be on disk.
          set -euo pipefail
          export ZIG_GLOBAL_CACHE_DIR="$SRCROOT/../../libs/workspace-core/.zig-global-cache"
          export ZIG_LOCAL_CACHE_DIR="$SRCROOT/../../libs/workspace-core/.zig-cache"
          cd "$SRCROOT/../../libs/workspace-core"
          # Xcode inherits the PATH of whatever launched it, and on macOS /opt/homebrew/bin
          # is only on PATH in a *login* shell. So `zig` was routinely not found here —
          # and until `set -e` above, the phase reported success anyway and linked
          # whatever libworkspace-core.a happened to be on disk.
          if [ -z "${ZIG:-}" ]; then
            ZIG=$(command -v zig || true)
          fi
          for candidate in /opt/homebrew/bin/zig /usr/local/bin/zig; do
            [ -n "$ZIG" ] && break
            [ -x "$candidate" ] && ZIG=$candidate
          done
          if [ -z "$ZIG" ]; then
            echo "error: zig not found. Install it (brew install zig) or set ZIG=/path/to/zig."
            exit 1
          fi
          if [ "$CONFIGURATION" = "Release" ]; then
            "$ZIG" build -Doptimize=ReleaseFast
          else
            "$ZIG" build -Doptimize=Debug
          fi
          # Re-archive with Apple libtool to fix Zig archive alignment
          LIBPATH="zig-out/lib/libworkspace-core.a"
          # Not TMPDIR: that is the environment variable every tool reads, and this
          # reassigned it and then `rm -rf`ed it.
          ARCHIVE_TMP=$(mktemp -d)
          cd "$ARCHIVE_TMP"
          ar x "$OLDPWD/$LIBPATH"
          chmod 644 *.o
          libtool -static -o "$OLDPWD/$LIBPATH" *.o
          rm -rf "$ARCHIVE_TMP"
    postBuildScripts:
      - name: Bundle Ghostty shell integration
        basedOnDependencyAnalysis: false
        script: |
          # Ghostty finds its shell integration (OSC 7 cwd reporting, prompt marks)
          # through GHOSTTY_RESOURCES_DIR, which GhosttyRuntime points at this copy.
          SRC="$SRCROOT/../../vendor/ghostty/zig-out/share/ghostty/shell-integration"
          DEST="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources/ghostty"
          if [ ! -d "$SRC" ]; then
            echo "warning: ghostty shell-integration not found at $SRC; cwd tracking will be disabled"
            exit 0
          fi
          mkdir -p "$DEST"
          rsync -a --delete "$SRC" "$DEST/"
    dependencies:
      - framework: ../../vendor/ghostty/macos/GhosttyKit.xcframework
        embed: false
      - sdk: AppKit.framework
      - sdk: Carbon.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: IOKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jinto.codespark
        MARKETING_VERSION: 1.1.1
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CodeSpark
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 JAE KWON PARK. All rights reserved.
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../../libs/workspace-core/include
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/../../libs/workspace-core/zig-out/lib
        OTHER_LDFLAGS:
          - $(inherited)
          - -lworkspace-core
          - -lsqlite3
          - -lc++
        OTHER_SWIFT_FLAGS:
          - $(inherited)
          - -D
          - GHOSTTY_FIRST
        SWIFT_OBJC_BRIDGING_HEADER: CodeSpark/Bridge/CodeSpark-Bridging-Header.h
      configs:
        Debug:
          PRODUCT_NAME: CodeSpark Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.jinto.codespark.dev
          INFOPLIST_KEY_CFBundleDisplayName: CodeSpark Dev
        Release:
          PRODUCT_NAME: CodeSpark
  CodeSparkTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - CodeSparkTests
    dependencies:
      - target: CodeSpark
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../../libs/workspace-core/include
  CodeSparkUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - CodeSparkUITests
    dependencies:
      - target: CodeSpark
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
